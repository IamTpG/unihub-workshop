schema: spec-driven

context: |
  Language: English
  All artifacts should be written in English.
  Project: UniHub Workshop
  Stack: React, TypeScript, Node.js, Express, Prisma, PostgreSQL (Neon), Redis, BullMQ
  Architecture: modular monolith with async workers
  Constraints:
  - Team size: 2 developers
  - Timeline: 4 evenings
  - Prioritize shippable MVP and demoability
  - Mobile features are implemented via responsive web app
  - Offline check-in uses localStorage and sync API
  Quality goals:
  - Avoid overengineering
  - Prefer simple, explicit modules
  - Keep API contracts stable
  - Docs may be refined after implementation, but must match code

rules:
  proposal:
    - State why this slice matters for the course requirements
    - Define non-goals to control scope
  specs:
    - Use Given/When/Then
    - Include unhappy paths and timeout/failure scenarios
  design:
    - Include sequence steps for critical flows
    - Mention failure isolation and fallback behavior
  tasks:
    - Split work between Developer A and Developer B
    - Keep tasks completable within one evening
